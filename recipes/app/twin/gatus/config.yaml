storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 100
  maximum-number-of-events: 50

ui:
  title: DropLive Status | Gatus
  header: DropLive Status
  description: A lightweight status dashboard with persistent check history.
  dashboard-heading: Status checks
  dashboard-subheading: Live checks for the synthetic Northstar company.

endpoints:
  - name: Customer portal
    group: Northstar production
    url: ${GATUS_STABLE_URL}
    interval: 15s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5s"
  - name: Billing incident
    group: Northstar production
    url: ${GATUS_FAILING_URL}
    interval: 15s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5s"
  - name: Worker fleet
    group: Northstar production
    url: ${GATUS_FLAPPING_URL}
    interval: 15s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5s"
