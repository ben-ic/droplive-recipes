version: 1
kind: app
description: "Automated developer-oriented status page with alerting and incident support"
repository: https://github.com/twin/gatus
run:
  port: 8080
  health:
    path: /health
    contains:
    - '"status":"UP"'
emulators:
  targets:
    capability: http.targets.v1
    access: server
    dataset: business.saas_company.v1
    bindings:
      GATUS_STABLE_URL: stable_url
      GATUS_FAILING_URL: failing_url
      GATUS_FLAPPING_URL: flapping_url
