version: 1
kind: app
tagline: "Home inventory"
description: "A continuation of HomeBox the inventory and organization system built for the Home User"
repository: https://github.com/sysadminsmedia/homebox
world: business.saas_company.v1
run:
  port: 7745
  data:
  - /data
  health: /api/v1/status
environment:
  # Homebox refuses to start without it: "panic: auth.api_key_pepper must be
  # set". It is the secret its API keys are peppered with, so it is exactly the
  # kind of value DropLive should mint per demo rather than have anyone pick.
  HBOX_AUTH_API_KEY_PEPPER:
    owner: droplive
    format: hex
    length: 64
  HBOX_DEMO_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: demo@example.com
