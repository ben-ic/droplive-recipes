version: 1
kind: app
tagline: "Website analytics"
description: "Privacy-focused website analytics that does not use cookies"
repository: https://github.com/umami-software/umami
# The company this demo is stocked with before the visitor arrives. Its traffic
# is in the application's own store, so there is no emulator to hang it off.
world: business.saas_company.v1
run:
  port: 3000
  health: /
companions:
  database: postgres
sign_in:
  username: admin
  password: umami
  note: Upstream default for a fresh database. Change it from the profile settings.
