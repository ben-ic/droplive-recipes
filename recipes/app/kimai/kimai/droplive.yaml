version: 1
kind: app
tagline: "Time tracking"
description: "Track time against projects and customers, and export it for invoicing"
repository: https://github.com/kimai/kimai
# The company this demo is stocked with before the visitor arrives. Its data is
# in the application's own store, so there is no emulator to hang it off.
world: business.saas_company.v1
run:
  port: 8001
  health: /
  # Kimai opens on its own first-run wizard until somebody answers it. The
  # entrypoint answers it, and this is where it sends a signed-in owner.
  open: /en/timesheet/
companions:
  database: mariadb
environment:
  # Kimai's image creates its first administrator only when it is given a
  # password, so without this the demo starts perfectly and nobody can sign in.
  # The address beside it is a literal in the Dockerfile.
  ADMINPASS:
    owner: droplive
    format: password
    length: 24
    login:
      username: maya@northstar-relay.invalid
