version: 1
kind: app
tagline: "Open source kanban"
description: "The Open Source kanban, built with Meteor"
repository: https://github.com/wekan/wekan
run:
  port: 8080
  health: /
# Wekan reads MONGO_URL, not DATABASE_URL.
companions:
  database:
    type: mongodb
    bindings:
      MONGO_URL: url
