version: 1
kind: app
tagline: "Personal finance manager"
description: "Firefly III: a personal finances manager"
repository: https://github.com/firefly-iii/firefly-iii
run:
  port: 8080
  health: /
# Laravel reads its connection in parts and defaults the user to 'app'. With only
# DATABASE_URL bound it reached the companion and was refused:
# "SQLSTATE[HY000] [1045] Access denied for user 'app'@'172.18.x.x'".
companions:
  database:
    type: mariadb
    bindings:
      DB_HOST: host
      DB_PORT: port
      DB_DATABASE: database
      DB_USERNAME: username
      DB_PASSWORD: password
environment:
  # Laravel refuses to boot without it, and mints nothing itself:
  # "Uncaught Illuminate\\Encryption\\MissingAppKeyException: No application
  # encryption key has been specified."
  #
  # The framework parses this as `base64:` followed by exactly 32 decoded bytes,
  # which is what the `laravel-base64` format produces.
  APP_KEY:
    owner: droplive
    format: laravel-base64
