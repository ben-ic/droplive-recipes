version: 1
kind: app
tagline: "Recipe and meal planner"
description: "Recipe manager and meal planner with shopping lists and a recipe importer"
repository: https://github.com/mealie-recipes/mealie
world: business.saas_company.v1
run:
  port: 9000
  data:
  - /app/data
  health: /api/app/about
environment:
  MEALIE_BOOTSTRAP_PASSWORD:
    owner: droplive
    format: url-safe
    login:
      username: owner@local.invalid
