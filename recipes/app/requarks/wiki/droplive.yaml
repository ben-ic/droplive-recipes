version: 1
kind: app
tagline: "Knowledge base"
description: "Knowledge base with Markdown and visual editors, page history and access rules"
repository: https://github.com/requarks/wiki
world: business.saas_company.v1
run:
  port: 3000
  data:
  - /wiki/data
  health: /
companions:
  database: postgres
environment:
  # Wiki.js has no non-interactive first-owner setting. The entrypoint completes
  # its local setup endpoint with this per-demo value, then puts it on the
  # visitor sign-in card.
  WIKI_ADMIN_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: maya@northstar-relay.droplive.test
