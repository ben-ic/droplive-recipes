version: 1
kind: app
tagline: "Collaborative notes"
description: "Collaborative Markdown notes several people can edit at once"
repository: https://github.com/hedgedoc/hedgedoc
run:
  port: 3000
  data:
  - /hedgedoc/public/uploads
  health:
    path: /_health
    contains:
    - '"ready":true'
companions:
  database: postgres
