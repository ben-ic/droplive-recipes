version: 1
kind: app
description: "Project management and issue tracking with wikis, forums and time tracking"
run:
  port: 3000
  health: /
  # The image declares this a VOLUME. Every OCI volume has to be declared here or
  # the launch preflight refuses the plan rather than hand the app an anonymous
  # one that dies with the container.
  data:
  - /usr/src/redmine/files
companions:
  database: postgres
sign_in:
  username: admin
  password: admin
  note: Upstream default for a fresh database. Redmine requires a password change after the first sign-in.
