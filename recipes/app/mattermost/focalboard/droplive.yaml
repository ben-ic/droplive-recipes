version: 1
kind: app
description: "Focalboard is an open source, self-hosted alternative to Trello, Notion, and Asana"
repository: https://github.com/mattermost/focalboard
run:
  port: 8000
  health: /
  # Every path the image declares as an OCI VOLUME. The launch preflight
  # refuses a plan that omits one rather than hand the app an anonymous
  # volume that dies with the container.
  data:
  - /opt/focalboard/data
