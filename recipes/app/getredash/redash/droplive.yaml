version: 1
kind: app
tagline: "Data dashboards"
description: "Make Your Company Data Driven. Connect to any data source, easily visualize, dashboard and share your data"
repository: https://github.com/getredash/redash
run:
  port: 5000
  health: /
# Redash names both connections itself, and without them fell back to localhost:
# "ConnectionError: Error 111 connecting to localhost:6379."
companions:
  database:
    type: postgres
    bindings:
      REDASH_DATABASE_URL: url
  cache:
    type: redis
    bindings:
      REDASH_REDIS_URL: url
