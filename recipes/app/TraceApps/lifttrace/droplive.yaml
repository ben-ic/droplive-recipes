version: 1
kind: app
tagline: Workout tracker
description: Self-hosted strength training diary with programs, exercise history, body metrics, and progress statistics
repository: https://github.com/TraceApps/lifttrace
run:
  port: 3003
  health: /api/auth/status
  open: /
environment:
  JWT_SECRET:
    owner: droplive
    format: hex
    length: 64
  LIFTTRACE_OWNER_PASSWORD:
    owner: droplive
    format: password
    length: 24
    pattern: '^[A-Z][a-z][0-9][!@#$%^&*_-][A-Za-z0-9!@#$%^&*_-]{20}$'
    login:
      username: lucas
