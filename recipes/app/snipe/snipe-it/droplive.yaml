version: 1
kind: app
description: "A free open source IT asset/license management system"
repository: https://github.com/snipe/snipe-it
run:
  port: 80
  health: /health
companions:
  database: mariadb
environment:
  # Laravel refuses to boot without a key, and requires this exact shape:
  # "base64:" followed by a base64-encoded 32-byte value.
  APP_KEY:
    owner: droplive
    format: laravel-base64
