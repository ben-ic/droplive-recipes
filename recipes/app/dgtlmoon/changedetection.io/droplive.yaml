version: 1
kind: app
tagline: "Website change monitor"
description: "Best and simplest tool for website change detection, web page monitoring, and website change alerts"
repository: https://github.com/dgtlmoon/changedetection.io
run:
  port: 5000
  health: /
  data:
    - /datastore
emulators:
  pages:
    capability: http.targets.v1
    access: server
    dataset: business.saas_company.v2
    bindings:
      DROPLIVE_COMPANY_URL: base_url
      DROPLIVE_CHANGING_URL: page_url
