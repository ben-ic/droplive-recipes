version: 1
kind: app
description: "Web app for browsing, reading and downloading eBooks in a Calibre library"
repository: https://github.com/janeczku/calibre-web
run:
  port: 8083
  health:
    path: /login
    contains:
    - 'name="username"'
  data:
  - /config
  - /books
environment:
  CALIBRE_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin
