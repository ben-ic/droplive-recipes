version: 1
kind: app
tagline: "Database client"
description: "Browse and query SQL and NoSQL databases from the browser"
repository: https://github.com/dbeaver/cloudbeaver
run:
  port: 8978
  health:
    path: /
    contains:
    - CloudBeaver
environment:
  CB_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: droplive-admin
