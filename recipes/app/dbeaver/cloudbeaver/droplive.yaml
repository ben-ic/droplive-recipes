version: 1
kind: app
description: "Cloud Database Manager"
repository: https://github.com/dbeaver/cloudbeaver
run:
  port: 8978
  health:
    path: /
    contains:
    - CloudBeaver
  data:
  - /opt/cloudbeaver/workspace
environment:
  CB_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: droplive-admin
