version: 1
kind: app
tagline: "Headless CMS"
description: "The flexible backend for all your projects Turn your DB into a headless CMS, admin panels, or apps with a custom UI, instant APIs, auth & more"
repository: https://github.com/directus/directus
run:
  port: 8055
  health: /server/health
environment:
  # Directus invents an admin password at first boot and prints it to its own
  # log -- "No admin password provided. Defaulting to 13GV6H7oEgjg" -- so the
  # demo served a sign-in page whose credential nobody could see. It uses the
  # one it is given, so DropLive gives it one and shows it.
  #
  # The email is Directus's own default for a fresh install; only the password
  # is ours to supply.
  ADMIN_PASSWORD:
    owner: droplive
    login:
      username: admin@example.com
  # Without it Directus warns "Tokens will not persist between restarts" and
  # signs sessions with a value it invented.
  SECRET:
    owner: droplive
