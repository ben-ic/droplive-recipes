version: 1
kind: app
tagline: "Headless CMS"
description: "The flexible backend for all your projects Turn your DB into a headless CMS, admin panels, or apps with a custom UI, instant APIs, auth & more"
repository: https://github.com/directus/directus
run:
  port: 8055
  data:
  - /directus/database
  - /directus/uploads
  health: /server/health
environment:
  # Directus must receive its bootstrap password. DropLive presents this owner
  # sign-in to the visitor after a session starts.
  ADMIN_PASSWORD:
    owner: droplive
    format: password
    login:
      username: maya@northstar-relay.example.com
  KEY:
    owner: droplive
    format: hex
    length: 64
  SECRET:
    owner: droplive
    format: hex
    length: 64
