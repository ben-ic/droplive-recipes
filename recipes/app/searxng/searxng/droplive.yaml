version: 1
kind: app
description: "SearXNG is a free internet metasearch engine which aggregates results from various search services and databases. Users are neither tracked nor profiled"
run:
  port: 8080
  health: /
  # Every path the image declares as an OCI VOLUME. The launch preflight
  # refuses a plan that omits one rather than hand the app an anonymous
  # volume that dies with the container.
  data:
  - /etc/searxng
  - /var/cache/searxng
