version: 1
kind: app
description: "Metasearch engine that queries other search engines without tracking users"
repository: https://github.com/searxng/searxng
run:
  port: 8080
  health: /
  # Every path the image declares as an OCI VOLUME. The launch preflight
  # refuses a plan that omits one rather than hand the app an anonymous
  # volume that dies with the container.
  data:
  - /etc/searxng
  - /var/cache/searxng
