version: 1
kind: app
run:
  port: 80
  health:
    path: /wp-login.php
    contains:
    - 'name="log"'
  data:
  - /var/www/html
companions:
  database: mysql
environment:
  # The recipe installs the short-lived demo and shows this credential on the
  # sign-in card. A visitor never handles the companion database credentials.
  WORDPRESS_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin
