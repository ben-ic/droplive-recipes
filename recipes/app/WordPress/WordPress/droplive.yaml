version: 1
kind: app
tagline: "Publishing platform"
description: "Publishing platform for websites, blogs and content-driven applications"
repository: https://github.com/WordPress/WordPress
world: business.saas_company.v2
run:
  port: 80
  health:
    path: /wp-login.php
    status:
    - 200
    - 302
companions:
  database:
    type: mysql
    bindings:
      DATABASE_URL: url
environment:
  # The recipe installs the short-lived demo and shows this credential on the
  # sign-in card. A visitor never handles the companion database credentials.
  WORDPRESS_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin
