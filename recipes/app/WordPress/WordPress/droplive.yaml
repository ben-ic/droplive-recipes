version: 1
kind: app
run:
  port: 80
  health:
    path: /wp-login.php
    status:
    - 200
    - 302
  data:
  # Keep uploads, themes, and plugins. Do not persist wp-config.php: the
  # build probe writes it with temporary database coordinates.
  - /var/www/html/wp-content
companions:
  database:
    type: mysql
    bindings:
      DATABASE_URL: url
environment:
  # The recipe installs the short-lived demo and shows this credential on the
  # sign-in card. A visitor never handles the companion database credentials.
  WORDPRESS_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin
