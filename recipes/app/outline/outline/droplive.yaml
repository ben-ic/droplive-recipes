version: 1
kind: app
description: "The fastest knowledge base for growing teams. Beautiful, realtime collaborative, feature packed, and markdown compatible"
repository: https://github.com/outline/outline
run:
  port: 3000
  health: /_health
  data:
  - /var/lib/outline/data
companions:
  database: postgres
  cache: redis
environment:
  # Outline checks both at boot and exits before listening. Each is read as 32
  # bytes of hex, so the length is 64 characters and not the default.
  SECRET_KEY:
    owner: droplive
    format: hex
    length: 64
  UTILS_SECRET:
    owner: droplive
    format: hex
    length: 64
