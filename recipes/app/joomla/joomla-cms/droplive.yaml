version: 1
kind: app
description: "Content management system for building websites and web applications"
repository: https://github.com/joomla/joomla-cms
run:
  port: 80
  health: /
  data:
  - /var/www/html
# Joomla cannot read a single DATABASE_URL. Its entrypoint wants the connection
# in parts and says so before halting: "Missing JOOMLA_DB_HOST and
# MYSQL_PORT_3306_TCP environment variables."
companions:
  database:
    type: mysql
    bindings:
      JOOMLA_DB_HOST: host
      JOOMLA_DB_PORT: port
      JOOMLA_DB_USER: username
      JOOMLA_DB_PASSWORD: password
      JOOMLA_DB_NAME: database
