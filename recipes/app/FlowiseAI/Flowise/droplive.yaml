version: 1
kind: app
tagline: "Visual LLM app builder"
description: "Build AI Agents, Visually"
repository: https://github.com/FlowiseAI/Flowise
run:
  port: 3000
  health: /
companions:
  database:
    type: postgres
    bindings:
      DATABASE_HOST: host
      DATABASE_PORT: port
      DATABASE_NAME: database
      DATABASE_USER: username
      DATABASE_PASSWORD: password
