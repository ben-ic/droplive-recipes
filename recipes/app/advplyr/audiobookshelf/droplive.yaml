version: 1
kind: app
description: "Self-hosted audiobook and podcast server"
repository: https://github.com/advplyr/audiobookshelf
run:
  port: 80
  health:
    path: /status
    contains:
    - '"isInit":true'
  data:
  - /config
environment:
  ROOT_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: root
