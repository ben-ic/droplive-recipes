version: 1
kind: app
run:
  port: 80
  # This pinned all-in-one image serves its backend health route at /_health.
  # /api/_health/ is the route for the split backend service, not this image.
  health: /_health
  data:
  - /baserow/data
companions:
  database: postgres
  cache: redis
environment:
  # Baserow refuses to start without a per-install key for its settings DB.
  SETTINGS_ENCRYPTION_KEY:
    owner: droplive
