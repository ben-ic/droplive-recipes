version: 1
kind: app
description: "Build databases, automations, apps & agents with AI \u2014 no code"
repository: https://github.com/bram2w/baserow
run:
  port: 80
  # The proxy-only /_health route becomes ready while first-run database
  # migrations are still running. Wait for the backend so the browser does not
  # open to a temporary 127.0.0.1:8000 connection error.
  health: /api/_health/
  data:
  - /baserow/data
companions:
  database:
    type: postgres
    bindings:
      DATABASE_URL: url
  cache: redis
environment:
  # Baserow refuses to start without a per-install key for its settings DB.
  SETTINGS_ENCRYPTION_KEY:
    owner: droplive
