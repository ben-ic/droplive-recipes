version: 1
kind: app
tagline: "Low-code event flows"
description: "Low-code programming for event-driven applications"
repository: https://github.com/node-red/node-red
# WorldFixture's pinned provider runtime and world are included in the image.
environment:
  NODE_RED_ADMIN_PASSWORD:
    owner: droplive
    format: password
    login:
      username: admin
  NODE_RED_CREDENTIAL_SECRET:
    owner: droplive
    format: hex
    length: 96
run:
  port: 1880
  data:
  - /data
  health: /healthz
