version: 1
kind: app
tagline: "Bookmark archive"
description: "Save, annotate and archive bookmarks, keeping a copy of the page"
repository: https://github.com/linkwarden/linkwarden
world: business.saas_company.v1
run:
  port: 3000
  health: /login
companions:
  database: postgres
environment:
  DROPLIVE_OWNER_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: maya
emulators:
  targets:
    capability: http.targets.v1
    access: server
    dataset: business.saas_company.v1
    bindings:
      DROPLIVE_COMPANY_URL: base_url
      DROPLIVE_CHANGING_URL: page_url
