version: 1
kind: app
run:
  port: 80
  health:
    path: /auth/login
    contains:
    - 'name="email"'
companions:
  database:
    type: mariadb
    bindings:
      DATABASE_URL: url
environment:
  ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin@example.invalid
