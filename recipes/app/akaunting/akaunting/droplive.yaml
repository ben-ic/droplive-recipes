version: 1
kind: app
description: "Online Accounting Software"
repository: https://github.com/akaunting/akaunting
run:
  port: 80
  health:
    path: /auth/login
    contains:
    - 'name="email"'
companions:
  database:
    # MariaDB speaks the MySQL protocol. Use the mysql companion kind because
    # Akaunting's Laravel build rejects `mariadb` as a driver name.
    type: mysql
    bindings:
      DATABASE_URL: url
environment:
  ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin@example.invalid
