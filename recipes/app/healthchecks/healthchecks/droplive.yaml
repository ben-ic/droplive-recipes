version: 1
kind: app
description: "Open-source cron job and background task monitoring service, written in Python & Django"
repository: https://github.com/healthchecks/healthchecks
run:
  port: 8000
  health: /
companions:
  # Without one it opens SQLite at a path it cannot write and exits with
  # "django.db.utils.OperationalError: unable to open database file".
  database: postgres
