version: 1
kind: app
tagline: "Metrics dashboards"
description: "The open and composable observability and data visualization platform"
repository: https://github.com/grafana/grafana
world: business.saas_company.v2
run:
  port: 3000
  data:
  - /var/lib/grafana
  health: /api/health
environment:
  # Grafana falls back to admin/admin when this is unset, then asks for a new
  # password on first sign-in. It uses the one it is given, so the demo gives it
  # one and puts that on the sign-in card instead of a credential printed in
  # Grafana's own documentation.
  #
  # The username stays Grafana's default, which is what makes login.username
  # usable here: it is a literal the visitor reads, and only the password is
  # generated.
  GF_SECURITY_ADMIN_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: admin
