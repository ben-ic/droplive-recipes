version: 1
kind: app
run:
  port: 9000
  health: /health
  data:
  - /listmonk/uploads
companions:
  database:
    type: postgres
    bindings:
      LISTMONK_DB_HOST: host
      LISTMONK_DB_PORT: port
      LISTMONK_DB_DATABASE: database
      LISTMONK_DB_USER: username
      LISTMONK_DB_PASSWORD: password
environment:
  LISTMONK_ADMIN_PASSWORD:
    owner: droplive
    format: password
    login:
      username: admin
