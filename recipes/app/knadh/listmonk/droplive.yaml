version: 1
kind: app
run:
  port: 9000
  health: /health
  data:
  - /listmonk/uploads
companions:
  database:
    type: postgres
    bindings:
      DROPLIVE_LISTMONK_DB_HOST: host
      DROPLIVE_LISTMONK_DB_PORT: port
      DROPLIVE_LISTMONK_DB_DATABASE: database
      DROPLIVE_LISTMONK_DB_USER: username
      DROPLIVE_LISTMONK_DB_PASSWORD: password
environment:
  LISTMONK_ADMIN_PASSWORD:
    owner: droplive
    format: password
    login:
      username: admin
