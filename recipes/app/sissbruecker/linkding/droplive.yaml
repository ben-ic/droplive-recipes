version: 1
kind: app
run:
  port: 9090
  health: /login/
  data:
  - /etc/linkding/data
environment:
  # Minted per demo, and handed to the visitor on the demo card. linkding reads
  # it once at boot to create `admin`; nothing else consumes it.
  LD_SUPERUSER_PASSWORD:
    owner: droplive
    login:
      username: admin
