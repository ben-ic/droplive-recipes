version: 1
kind: app
tagline: "Data explorer"
description: "An open source multi-tool for exploring and publishing data"
repository: https://github.com/simonw/datasette
# WorldFixture business.saas-company:v3 is built into the pinned image.
# There is no session world mount: the Dockerfile owns this snapshot's pin.
run:
  port: 8001
  health: /
  # Datasette's index lists databases; the database page is where the tables, the
  # saved queries, and the SQL editor are.
  open: /northstar
