version: 1
kind: app
tagline: "Uptime monitoring"
description: "A fancy self-hosted monitoring tool"
repository: https://github.com/louislam/uptime-kuma
run:
  port: 3001
  health:
    path: /dashboard
    contains:
    - Uptime Kuma
  data:
    - /app/data
environment:
  DROPLIVE_ADMIN_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: maya
emulators:
  targets:
    capability: http.targets.v1
    access: server
    dataset: business.saas_company.v2
    bindings:
      DROPLIVE_STABLE_URL: stable_url
      DROPLIVE_FAILING_URL: failing_url
      DROPLIVE_FLAPPING_URL: flapping_url
