server:
  port: 8080
  proxied: true

auth:
  secret-key: "@@GLANCE_SECRET_KEY@@"
  users:
    admin:
      password-hash: "@@GLANCE_ADMIN_PASSWORD_HASH@@"

branding:
  app-name: Northstar Relay
  logo-text: N

pages:
  - name: Operations
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: UTC
                label: UTC

          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            new-tab: true
            placeholder: Search the web

          - type: bookmarks
            groups:
              - title: Company work
                links:
                  - title: Release 2.8
                    url: https://github.com/
                    description: Product release review and open issues
                  - title: August month-end
                    url: https://github.com/
                    description: Finance close and customer invoice follow-up
              - title: Team tools
                links:
                  - title: GitHub
                    url: https://github.com/
                    description: Source, review, and release work
                  - title: Customer support
                    url: https://github.com/
                    description: Lumen Labs and renewal follow-up
