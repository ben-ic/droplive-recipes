version: 1
kind: app
tagline: "Minimal blogging platform"
description: "A clean, Markdown-based publishing platform made for writers. Write together and build a community"
repository: https://github.com/writefreely/writefreely
world: business.saas_company.v1
run:
  port: 8080
  health: /
  data:
  - /writefreely
environment:
  WRITEFREELY_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: droplive
  WRITEFREELY_HASH_SEED:
    owner: droplive
    format: hex
    length: 64
