version: 1
kind: app
run:
  port: 3000
  health:
    path: /api/health
    contains:
    - '"status":"ok"'
companions:
  database: postgres
  cache: upstash
environment:
  AUTH_SECRET:
    owner: droplive
    format: hex
  EMAIL_ENCRYPT_SECRET:
    owner: droplive
    format: hex
  EMAIL_ENCRYPT_SALT:
    owner: droplive
    format: hex
    length: 32
  INTERNAL_API_KEY:
    owner: droplive
  # Required non-empty, never exercised by the demo: Microsoft sign-in is not
  # offered and the Upstash token is not what the emulated cache authenticates
  # with. They were literals in the compose file, which demoted this whole
  # recipe off the declared path -- `environment.embedded_secret` refuses a
  # literal for a secret-like name, so a deterministic build fell through to the
  # planner and spent model calls deciding something the recipe already stated.
  #
  # Generated is also simply better than the placeholder it replaces: no
  # fake secret committed to a public repository, and a distinct value per demo.
  MICROSOFT_CLIENT_SECRET:
    owner: droplive
  UPSTASH_REDIS_TOKEN:
    owner: droplive
  API_KEY_SALT:
    owner: droplive
emulators:
  google:
    capability: google.oauth2.v1
    access: server-and-browser
    dataset: google.productivity_mailbox.v1
    bindings:
      GOOGLE_BASE_URL: unified_origin
      GOOGLE_CLIENT_ID: client_id
      GOOGLE_CLIENT_SECRET: non_authenticating_client_secret
      GOOGLE_PUBSUB_VERIFICATION_TOKEN: gmail_push_verification_token
    callbacks:
    - path: /api/google/webhook
      verification-environment: GOOGLE_PUBSUB_VERIFICATION_TOKEN
  llm:
    capability: llm.openai_chat.v1
    bindings:
      OPENAI_COMPATIBLE_BASE_URL: api_base_url
      OPENAI_COMPATIBLE_MODEL: model_name
      LLM_API_KEY: non_authenticating_api_key
