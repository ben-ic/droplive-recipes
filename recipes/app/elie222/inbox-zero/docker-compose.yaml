# Upstream publishes a working image but no Compose file, and the application
# refuses to start unless its whole environment validates at boot. Everything below
# is a public default or a value DropLive supplies; nothing here is a secret.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

      # The demo's own origin. The application and Better Auth read it under four
      # names, so all four come from the one value. BETTER_AUTH_URL is the
      # canonical server identity used after an OAuth callback; without it Better
      # Auth can derive the guest bind address and redirect to 0.0.0.0:3000.
      NEXT_PUBLIC_BASE_URL: "${PUBLIC_URL:?DropLive supplies the public origin}"
      INTERNAL_API_URL: "${PUBLIC_URL:?DropLive supplies the public origin}"
      AUTH_URL: "${PUBLIC_URL:?DropLive supplies the public origin}"
      BETTER_AUTH_URL: "${PUBLIC_URL:?DropLive supplies the public origin}"

      # Prisma runs migrations on DIRECT_URL and queries on DATABASE_URL. A demo
      # has one database, so both name it.
      DATABASE_URL: "${DATABASE_URL:?DropLive supplies the postgres companion}"
      DIRECT_URL: "${DATABASE_URL:?DropLive supplies the postgres companion}"

      # In-process queue. The hosted product uses QStash, which a demo has no
      # account for and does not need.
      QUEUE_BACKEND: internal

      # Billing is not part of a fifteen-minute demo, and the PWA service worker
      # outlives the session it was installed from.
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
      NEXT_PUBLIC_DISABLE_PWA: "true"

      # Required by the application's own schema (`z.string().min(1)`) even though a
      # demo never receives a real Pub/Sub delivery. It names a topic that does not
      # exist; the value has to be present, not real.
      GOOGLE_PUBSUB_TOPIC_NAME: projects/droplive-demo/topics/gmail

      # Microsoft sign-in is compiled in and validated at boot. A demo signs in with
      # Google, so this satisfies validation and authenticates nothing. Its paired
      # secret is generated per demo -- see MICROSOFT_CLIENT_SECRET in droplive.yaml.
      MICROSOFT_CLIENT_ID: droplive-demo

      # UPSTASH_REDIS_TOKEN is deliberately absent, here and in droplive.yaml. The
      # upstash companion mints it and starts its HTTP shim checking that same
      # value, so the token is the companion's to supply. Naming it here -- as a
      # literal or as a generated value -- overrides the companion with something
      # the shim will reject.
