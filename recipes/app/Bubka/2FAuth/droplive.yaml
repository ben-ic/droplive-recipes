version: 1
kind: app
tagline: "Two-factor code manager"
description: "A Web app to manage your Two-Factor Authentication (2FA) accounts and generate their security codes"
repository: https://github.com/Bubka/2FAuth
run:
  port: 8000
  health: /
  data:
  - /2fauth
environment:
  # Laravel refuses encrypted cookies and OAuth keys without an application key.
  APP_KEY:
    owner: droplive
    format: laravel-base64
