version: 1
kind: app
run:
  port: 8080
  health:
    path: /v1/health
    contains:
    - '"healthy":true'
  data:
  - /var/lib/ntfy
environment:
  # ntfy's entrypoint measures this before it will start. Declaring the shape is
  # the recipe's job; the entrypoint check is what proves it was honoured.
  NTFY_ADMIN_PASSWORD:
    owner: droplive
    format: url-safe
    length: 16
