version: 1
kind: app
run:
  port: 8080
  health:
    path: /v1/health
    contains:
    - '"healthy":true'
  data:
  - /var/lib/ntfy
environment:
  # A person reads this off the demo card and types it, so mint a length that is
  # pleasant to type instead of the long default. Sixteen url-safe characters is
  # about 96 bits -- far more than a fifteen-minute session needs, and well clear
  # of the minimum the entrypoint enforces.
  #
  # That entrypoint check does not verify this declaration. It is a minimum, so
  # the default length passes it too; it catches a missing or unusable value,
  # which is all it is for.
  NTFY_ADMIN_PASSWORD:
    owner: droplive
    format: url-safe
    length: 16
