version: 1
kind: app
description: "High performance self-hosted photo and video management solution"
repository: https://github.com/immich-app/immich
run:
  port: 2283
  health: /api/server/ping
  data:
    - /data
environment:
  DB_PASSWORD:
    owner: droplive
companions:
  database:
    type: postgres
    bindings:
      DB_HOSTNAME: host
  redis:
    type: redis
    bindings:
      REDIS_HOSTNAME: host
