version: 1
kind: app
description: "Open source self-hosted web archiving. Takes URLs/browser history/bookmarks/Pocket/Pinboard/etc., saves HTML, JS, PDFs, media, and more"
run:
  port: 8000
  health: /
  data:
  - /data
environment:
  # ArchiveBox creates this administrator on the first start when both values
  # are present. DropLive shows the generated password on the sign-in card.
  ADMIN_PASSWORD:
    owner: droplive
    login:
      username: admin
