version: 1
kind: app
description: "A community-supported supercharged document management system: scan, index and archive all your documents"
run:
  port: 8000
  health: /
  # Every path the image declares as an OCI VOLUME. The launch preflight
  # refuses a plan that omits one, and each of these is a directory the
  # app fills at runtime -- a declared data dir is a fresh mkfs.ext4, so
  # only a path the image does not already populate is safe to declare.
  data:
  - /usr/src/paperless/consume
  - /usr/src/paperless/data
  - /usr/src/paperless/export
  - /usr/src/paperless/media
# Paperless names both connections itself. With only DATABASE_URL and REDIS_URL
# bound, its s6 init could not find either -- "unable to start service
# init-wait-for-redis: command exited 1" -- and stopped the container.
companions:
  database:
    type: postgres
    bindings:
      PAPERLESS_DBHOST: host
      PAPERLESS_DBPORT: port
      PAPERLESS_DBNAME: database
      PAPERLESS_DBUSER: username
      PAPERLESS_DBPASS: password
  cache:
    type: redis
    bindings:
      PAPERLESS_REDIS: url
environment:
  # Django refuses to start otherwise: "PAPERLESS_SECRET_KEY is not set or is the
  # default 'change-me' value."
  PAPERLESS_SECRET_KEY:
    owner: droplive
  PAPERLESS_ADMIN_PASSWORD:
    owner: droplive
    format: password
    login:
      username: admin
