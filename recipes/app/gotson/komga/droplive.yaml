version: 1
kind: app
tagline: "Comic and manga server"
description: "Media server for comics/mangas/BDs/magazines/eBooks with API, OPDS, Kobo Sync and KOReader Sync support"
repository: https://github.com/gotson/komga
run:
  port: 25600
  health: /
environment:
  KOMGA_ADMIN_PASSWORD:
    owner: droplive
    format: password
    length: 24
    login:
      username: admin@example.org
