version: 1
kind: app
description: "Jenkins automation server"
repository: https://github.com/jenkinsci/jenkins
run:
  port: 8080
  health: /login
  data:
  - /var/jenkins_home
environment:
  JENKINS_ADMIN_PASSWORD:
    owner: droplive
    format: alphanumeric
    length: 24
    login:
      username: admin
