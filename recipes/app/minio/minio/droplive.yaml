version: 1
kind: app
description: "S3-compatible object storage server with a web console"
repository: https://github.com/minio/minio
run:
  port: 9001
  health: /
environment:
  # The console is a login page, so the demo has to hand the visitor something.
  # Left alone, MinIO uses minioadmin/minioadmin and warns about it in its own
  # log -- a credential every reader of its documentation already knows, live on
  # a reachable demo.
  #
  # Only the password needs minting. MinIO requires the root user and password
  # to be set together, but the username is not a secret: it is a literal in the
  # Dockerfile, and the same literal here so the card can show it.
  MINIO_ROOT_PASSWORD:
    owner: droplive
    login:
      username: minioadmin
