version: 1
kind: app
description: "Renders an OpenAPI description as browsable, testable API documentation"
repository: https://github.com/swagger-api/swagger-ui
run:
  port: 8080
  health: /
emulators:
  specification:
    capability: openapi.document.v1
    access: browser
    dataset: business.saas_company.v1
    bindings:
      URL: openapi_url
