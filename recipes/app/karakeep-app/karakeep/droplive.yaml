version: 1
kind: app
tagline: "Bookmark and note keeper"
description: "A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search"
repository: https://github.com/karakeep-app/karakeep
run:
  port: 3000
  data:
  - /data
  health:
    path: /api/health
    contains:
    - '"status":"ok"'
environment:
  # Karakeep uses this production-only value to sign local-auth JWTs. Without
  # it, the health endpoint returns NextAuth's NO_SECRET error.
  NEXTAUTH_SECRET:
    owner: droplive
    format: url-safe
    length: 48
