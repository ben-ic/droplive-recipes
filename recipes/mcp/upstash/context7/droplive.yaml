version: 1
kind: mcp
description: "Context7 Platform -- Up-to-date code documentation for LLMs and AI code editors"
mcp:
  transport: stdio
  package:
    manager: npm
    name: "@upstash/context7-mcp"
    version: "4.0.2"
    integrity: "sha512-PdNL3hFK7tFe4oDzTa10nH8M+Ue82ShZXrsKnY0OY29TXhazeb9qZp2B/BwrxHfKua3ywu7FlqQ8HG6uyQHdaw=="
  command: ["context7-mcp"]
  network: observed
  expected_hosts: [context7.com]
  tools:
    examples:
      resolve-library-id: {query: "How do I create a route?", libraryName: "Phoenix"}
      query-docs: {libraryId: "/phoenixframework/phoenix", query: "How do I create a JSON route?"}
    smoke:
      name: resolve-library-id
      arguments: {query: "How do I create a route?", libraryName: "Phoenix"}
