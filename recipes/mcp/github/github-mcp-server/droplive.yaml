version: 1
kind: mcp
emulators:
  github:
    capability: github.api.v1
    dataset: github.collaboration.v1
    bindings:
      GITHUB_HOST: base_url
      GITHUB_PERSONAL_ACCESS_TOKEN: non_authenticating_token
mcp:
  transport: stdio
  package:
    manager: github-release
    name: "github/github-mcp-server"
    version: "1.9.0"
    artifact: "github-mcp-server_Linux_x86_64.tar.gz"
    integrity: "sha256:cbf38bd3364518ccf80b6a25587d5ef11655b15d63cbb48bc066384d0b5b5964"
  command: ["github-mcp-server", "stdio", "--read-only", "--tools", "get_file_contents,search_repositories,issue_read,list_issues"]
  network: observed
  tools:
    examples:
      get_file_contents: {owner: "octocat", repo: "hello-world", path: "/README.md"}
      issue_read: {method: "get", owner: "octocat", repo: "hello-world", issue_number: 1}
    smoke:
      name: get_file_contents
      arguments: {owner: "octocat", repo: "hello-world", path: "/README.md"}
