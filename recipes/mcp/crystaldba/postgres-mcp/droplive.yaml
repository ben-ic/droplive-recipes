version: 1
kind: mcp
tagline: "Postgres access and tuning"
description: "Postgres MCP Pro provides configurable read/write access and performance analysis for you and your AI agents"
repository: https://github.com/crystaldba/postgres-mcp
companions:
  database:
    type: postgres
    dataset: postgres.store.v1
    bindings:
      DATABASE_URI: url
mcp:
  transport: stdio
  package:
    manager: pypi
    name: "postgres-mcp"
    version: "0.3.0"
    artifact: "postgres_mcp-0.3.0-py3-none-any.whl"
    integrity: "sha256:455dd71ed8deab77a67af2468e6f059dd0f114e05c0031ab47306a7048dc30bf"
  command: ["postgres-mcp", "--access-mode=restricted"]
  network: observed
  tools:
    examples:
      list_schemas: {}
      list_objects: {schema_name: "public", object_type: "table"}
      execute_sql: {sql: "SELECT id, name, email FROM customers ORDER BY id LIMIT 20"}
    smoke:
      name: execute_sql
      arguments: {sql: "SELECT id, name, email FROM customers ORDER BY id LIMIT 20"}
