version: 1
kind: mcp
description: "Reads, writes and searches files inside directories the server is allowed to use"
repository: https://github.com/modelcontextprotocol/servers
product: filesystem
mcp:
  transport: stdio
  package:
    manager: npm
    name: "@modelcontextprotocol/server-filesystem"
    version: "2026.7.10"
    integrity: "sha512-Mmjg4anFBD5OzbPnGJOA0jPPN8645ERhQk38HQLpSenx1ox9bfdPkmAzUnNjeQtqQGFLtKe13J20RtLBmUKMZA=="
  command: ["mcp-server-filesystem", "/workspace"]
  network: none
  tools:
    examples:
      read_text_file: {path: "/workspace/README.md", head: 20}
      write_file: {path: "/workspace/output.txt", content: "DropLive fixture output\n"}
      list_directory: {path: "/workspace"}
    smoke:
      name: list_allowed_directories
      arguments: {}
