version: 1
kind: mcp
mcp:
  transport: stdio
  package:
    manager: npm
    name: "chrome-devtools-mcp"
    version: "1.7.0"
    integrity: "sha512-6xFW7oiUxTxZuHcfyYBkKQtmttjCbfifKZMSEk5CV8H2FucvKweYiJr8CblddYHtYjA4C14K9VAs1r49906RBA=="
  command: ["chrome-devtools-mcp", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
  network: {mode: observed, destinations: ["*"]}
  tools:
    examples:
      list_pages: {}
      new_page: {url: "https://example.com/", background: false, isolatedContext: "droplive-fixture", timeout: 10000}
      take_snapshot: {verbose: false}
    smoke:
      - tool: new_page
        arguments: {url: "https://example.com/", background: false, isolatedContext: "droplive-fixture", timeout: 10000}
