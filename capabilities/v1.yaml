schema: droplive.capabilities/v1

capabilities:
  mail.smtp.v1:
    access:
      - server
    outputs:
      transport: public_value
      host: server_address
      port: server_port
      from_address: public_value
    datasets: []

  llm.openai_chat.v1:
    access:
      - server
    outputs:
      api_base_url: server_url
      model_name: public_value
      non_authenticating_api_key: public_value
    datasets: []

  microsoft.oidc.v1:
    access:
      - server-and-browser
    outputs:
      authorization_endpoint: browser_url
      token_endpoint: server_url
      userinfo_endpoint: server_url
      jwks_endpoint: server_url
      client_id: public_value
      non_authenticating_client_secret: public_value
    datasets: []

  google.oauth2.v1:
    access:
      - server-and-browser
    outputs:
      unified_origin: browser_url
      client_id: public_value
      non_authenticating_client_secret: public_value
      gmail_push_verification_token: generated_session_secret
    datasets:
      - google.productivity_mailbox.v1

  google.gmail.v1:
    access:
      - server
    outputs:
      api_base_url: server_url
    datasets:
      - google.productivity_mailbox.v1

  storage.s3.v1:
    access:
      - server
    outputs:
      endpoint: server_url
      region: public_value
      bucket: public_value
      access_key: generated_session_secret
      secret_key: generated_session_secret
    datasets: []

  browser.chromium.v1:
    access:
      - server
    outputs:
      cdp_endpoint: server_url
    datasets: []

  computer.daytona.v1:
    access:
      - server-and-browser
    outputs:
      api_url: server_url
      api_key: generated_session_secret
      target: public_value
    datasets: []

  github.api.v1:
    access:
      - server
    outputs:
      base_url: server_url
      non_authenticating_token: public_value
    datasets:
      - github.collaboration.v1

  http.rss.v1:
    access:
      - server
    outputs:
      feed_url: server_url
    datasets:
      - business.saas_company.v1

  http.targets.v1:
    access:
      - server
    outputs:
      base_url: server_url
      page_url: server_url
      stable_url: server_url
      failing_url: server_url
      flapping_url: server_url
    datasets:
      - business.saas_company.v1

  prometheus.scrape.v1:
    access:
      - server
    outputs:
      metrics_url: server_url
    datasets:
      - business.saas_company.v1

  openapi.document.v1:
    access:
      - browser
    outputs:
      openapi_url: browser_url
    datasets:
      - business.saas_company.v1
