name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 tools/lint_recipes.py
      - run: python3 tools/test_environment_schema.py
      - run: python3 tools/test_kind_schema.py
      - run: python3 tools/test_entrypoint_rules.py
